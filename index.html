  <div class="player-wrap" id="playerWrap" aria-label="Reproductor en vivo de Don Omar Radio">

    <br><a href="https://ssh101.com/live/radiosessions" target="_blank" rel="noopener noreferrer">Abrir reproductor oficial de respaldo</a>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
const button = document.getElementById('liveButton');
const wrap = document.getElementById('playerWrap');
const player = document.getElementById('sshPlayer');
const fallback = document.getElementById('fallback');
const status = document.getElementById('status');
let hls = null;
let usingNewUrl = true;
const streamUrls = [
  'https://live20.bozztv.com/akamaissh101/ssh101/radiosessions/playlist.m3u8',
  'https://lbgo.bozztv.com/ssh101/ssh101/radiosessions/playlist.m3u8'
];
function stopStream() {
  if (hls) { hls.destroy(); hls = null; }
  player.pause();
  player.removeAttribute('src');
  player.load();
}
function startStream(index) {
  stopStream();
  const url = streamUrls[index];
  status.textContent = 'Conectando con SSH101…';
  if (player.canPlayType('application/vnd.apple.mpegurl')) {
    player.src = url;
    player.load();
    player.play().then(() => { status.textContent = 'Señal en vivo conectada.'; }).catch(() => { status.textContent = 'Pulsa ▶ en el reproductor para iniciar el audio.'; });
    player.onerror = () => {
      if (index === 0) startStream(1);
      else status.textContent = 'No se pudo cargar la señal. Usa el enlace oficial de respaldo.';
    };
    return;
  }
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ enableWorker: true, lowLatencyMode: true });
    hls.loadSource(url);
    hls.attachMedia(player);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      player.play().then(() => { status.textContent = 'Señal en vivo conectada.'; }).catch(() => { status.textContent = 'Pulsa ▶ en el reproductor para iniciar el audio.'; });
    });
    hls.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) {
        if (index === 0) startStream(1);
        else status.textContent = 'No se pudo cargar la señal. Usa el enlace oficial de respaldo.';
      }
    });
    return;
  }
  status.textContent = 'Este navegador no admite reproducción HLS integrada. Usa el enlace oficial de respaldo.';
}
button.addEventListener('click', () => {
  const opening = !wrap.classList.contains('open');
  wrap.classList.toggle('open', opening);
  fallback.classList.toggle('open', opening);
  button.setAttribute('aria-expanded', String(opening));
  if (opening) {
    startStream(0);
    setTimeout(() => wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 150);
  } else {
    stopStream();
  }
});
</script>
